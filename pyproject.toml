[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "broadmind-eeg"
version = "0.1.0"
description = "Python SDK for the BROADMIND 8-channel dry-electrode EEG headset (BrainFlow transport, OpenBCI-compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BROADMIND" }]
keywords = ["eeg", "bci", "broadmind", "openbci", "brainflow", "neuroscience"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies are deliberately small: BrainFlow owns the device
# transport, edfio owns the EDF container, numpy owns the maths.
dependencies = [
    "numpy>=1.23",
    "brainflow>=5.12",
    "edfio>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# `ruff` is pinned so that `ruff check .` behaves identically locally and in CI;
# bump it deliberately together with .github/workflows/ci.yml.
dev = ["pytest>=7", "ruff==0.17.5"]

[project.scripts]
broadmind = "broadmind.cli:main"

[project.urls]
Documentation = "https://github.com/BROADMIND-BCI/broadmind-eeg#readme"
Source = "https://github.com/BROADMIND-BCI/broadmind-eeg"

[tool.setuptools]
packages = ["broadmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberate, version-stable baseline for a first public release: the classic
# pycodestyle/pyflakes subset. This keeps CI green across ruff releases while
# the codebase is still a scaffold; tighten it in a dedicated pull request.
select = ["E4", "E7", "E9", "F"]
